name: SMACD 2027 mmWave LNA Verification CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    name: Full Verification Pipeline (IHP SG13G2)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System EDA Tools (KLayout & Ngspice)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends klayout ngspice

      - name: Install Python Dependencies
        run: |
          pip install numpy scipy matplotlib

      - name: Fetch IHP SG13G2 Open PDK
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/IHP-GmbH/IHP-Open-PDK.git ihp_pdk
          cd ihp_pdk
          git sparse-checkout set ihp-sg13g2/libs.tech/klayout ihp-sg13g2/libs.tech/ngspice ihp-sg13g2/libs.ref
          git checkout e73adb4045731ddec21634146d536380057f6a26
          cd ..

      - name: Run End-to-End Verification Pipeline
        run: |
          python reproduce.py

      - name: Upload Verification Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mmwave-lna-verification-results
          path: |
            results/
            gds/reports/
            gds/lna_top.gds
